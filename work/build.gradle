plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.scathiard.portablesupply'
version = mod_version
base.archivesName = 'create-portable-supply'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def verificationRoot = providers.gradleProperty('verificationRoot')
if (verificationRoot.isPresent()) {
    layout.buildDirectory = file("${verificationRoot.get()}/build")
}
def gameRoot = verificationRoot.orElse('run').get()
def packagedTest = providers.gradleProperty('packagedTest').isPresent()
def clientSmoke = providers.gradleProperty('clientSmoke').isPresent()

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    runtimeClasspath.extendsFrom localRuntime
}
def testModJar = tasks.register('testModJar', Jar) {
    archiveBaseName = 'portable-supply-verification'
    destinationDirectory = layout.buildDirectory.dir('verification')
    from sourceSets.gameTest.output
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
dependencies {
    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    localRuntime 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    if (packagedTest) {
        localRuntime files(tasks.named('jar').flatMap { it.archiveFile })
        localRuntime files(testModJar.flatMap { it.archiveFile })
    }
}

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client {
            client()
            gameDirectory = file("${gameRoot}/client")
            systemProperty 'portable_supply.clientSmoke', String.valueOf(clientSmoke)
            if (clientSmoke) programArguments.addAll('--width', '1152', '--height', '720')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file("${gameRoot}/gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'portable_supply_test'
            systemProperty 'portable_supply.fullCostTest', String.valueOf(providers.gradleProperty('fullCostTest').isPresent())
        }
        configureEach {
            jvmArgument '-Djava.io.tmpdir=' + System.getProperty('java.io.tmpdir')
            systemProperty 'portable_supply.verifyJar', String.valueOf(packagedTest)
        }
    }
    mods {
        if (!packagedTest) {
            portable_supply { sourceSet sourceSets.main }
            portable_supply_test { sourceSet sourceSets.gameTest }
        }
    }
}

tasks.named('processResources') {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand modVersion: project.version }
}
tasks.named('runGameTestServer') { dependsOn 'gameTestClasses', 'jar' }
if (packagedTest) {
    tasks.withType(net.neoforged.moddevgradle.internal.RunGameTask).configureEach {
        dependsOn tasks.named('jar'), testModJar
        def outputs = sourceSets.main.output.files + sourceSets.gameTest.output.files
        def original = project.files(new ArrayList<>(classpathProvider.from))
        classpathProvider.setFrom(original.filter { !outputs.contains(it) })
        setClasspath(project.files(classpath.files.findAll { !outputs.contains(it) }))
        doFirst {
            def paths = classpathProvider.files + classpath.files
            if (paths.any { outputs.contains(it) } ||
                    !paths.contains(tasks.named('jar').get().archiveFile.get().asFile) ||
                    !paths.contains(testModJar.get().archiveFile.get().asFile)) {
                throw new GradleException('Packaged verification requires both JARs and zero loose class directories')
            }
        }
    }
}
