plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.scathiard.portablesupply'
version = mod_version
base.archivesName = 'create-portable-supply'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

def verificationRoot = providers.gradleProperty('verificationRoot')
if (verificationRoot.isPresent()) {
    layout.buildDirectory = file("${verificationRoot.get()}/build")
}
def gameRoot = verificationRoot.orElse('run').get()
def packagedTest = providers.gradleProperty('packagedTest').isPresent()

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    runtimeClasspath.extendsFrom localRuntime
}
dependencies {
    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") { transitive = false }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    localRuntime 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    if (packagedTest) localRuntime files(tasks.named('jar').flatMap { it.archiveFile })
}

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client {
            client()
            gameDirectory = file("${gameRoot}/client")
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file("${gameRoot}/gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'portable_supply_test'
        }
        configureEach {
            jvmArgument '-Djava.io.tmpdir=' + System.getProperty('java.io.tmpdir')
        }
    }
    mods {
        if (!packagedTest) portable_supply { sourceSet sourceSets.main }
        portable_supply_test { sourceSet sourceSets.gameTest }
    }
}

tasks.named('processResources') {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand modVersion: project.version }
}
tasks.named('runGameTestServer') { dependsOn 'gameTestClasses', 'jar' }
